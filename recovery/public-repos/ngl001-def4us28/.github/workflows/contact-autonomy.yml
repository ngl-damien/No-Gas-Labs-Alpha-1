name: CONTACT autonomy stepwire
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'contact/runtime.py'
      - '.github/workflows/contact-autonomy.yml'
permissions:
  contents: write
concurrency:
  group: contact-autonomy
  cancel-in-progress: false
jobs:
  stepwire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute one evidence-bearing transition
        run: python contact/runtime.py
      - name: Persist evidence and state
        run: |
          git config user.name 'NGL CONTACT'
          git config user.email 'contact@users.noreply.github.com'
          git add contact/state.json contact/ledger.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'contact: persist autonomous observation'
          git push
