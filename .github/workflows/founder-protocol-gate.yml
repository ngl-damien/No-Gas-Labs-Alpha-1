name: Founder Protocol Gate

on:
  push:
    branches:
      - main
      - docs/universal-institutional-continuity-relay-20261127
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  founder-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Require and fingerprint all governing documents
        run: npm run agent:preflight:ci -- --path docs/operations/NEOPHYTE_FOUNDER_ABOVE_AND_BEYOND_PROTOCOL.md --path docs/operations/UNIVERSAL_INSTITUTIONAL_CONTINUITY_RELAY.md
      - name: Run governance preflight regression tests
        run: node --test test/agent-governance.test.mjs
      - name: Require a Founder-facing record and relay update for new pull requests
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          pull = event.get("pull_request")
          if not pull:
              print("Push/manual run: pull-request record check is not applicable.")
              raise SystemExit(0)

          created_at = pull.get("created_at", "")
          if created_at < "2026-11-28T00:00:00Z":
              print("Existing PR predates the enforcement effective date; grandfathered.")
              raise SystemExit(0)

          body = pull.get("body") or ""
          required_sections = [
              "## Founder-facing outcome",
              "## Evidence and verification",
              "## What remains / limitations",
              "## Next action",
              "## Above-and-Beyond self-audit",
              "## Preflight and continuity",
          ]
          missing = [heading for heading in required_sections if heading not in body]
          if missing:
              print("FAIL CLOSED: pull request is missing required Founder-facing sections:")
              print("\\n".join("  " + heading for heading in missing))
              raise SystemExit(1)

          base_sha = pull["base"]["sha"]
          head_sha = pull["head"]["sha"]
          number = str(pull["number"])
          subprocess.run(["git", "fetch", "origin", base_sha, "--depth=1"], check=True)
          subprocess.run([
              "git", "fetch", "origin",
              "refs/pull/" + number + "/head:refs/remotes/origin/pr-" + number
          ], check=True)
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base_sha + "..." + head_sha],
              text=True
          ).splitlines()
          relay_path = "docs/operations/UNIVERSAL_INSTITUTIONAL_CONTINUITY_RELAY.md"
          if relay_path not in changed:
              print("FAIL CLOSED: every new substantive PR must update the append-only continuity relay.")
              raise SystemExit(1)
          print("Founder-facing PR record and continuity relay update are present.")
          PY
