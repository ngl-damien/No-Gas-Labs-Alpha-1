name: Android Alpha-1

on:
  pull_request:
    paths:
      - 'android/**'
      - 'game/**'
      - 'docs/meteor/android.md'
      - 'docs/operations/MMORPG_COMPLETION_LEDGER.md'
      - 'package.json'
      - 'test/agent-governance.test.mjs'
      - '.github/workflows/android-alpha1.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'game/**'
      - 'docs/meteor/android.md'
      - 'docs/operations/MMORPG_COMPLETION_LEDGER.md'
      - 'package.json'
      - 'test/agent-governance.test.mjs'
      - '.github/workflows/android-alpha1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 emulator
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM access for Android emulator
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is unavailable; API 35 x86_64 instrumentation requires a hardware-accelerated runner."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::KVM exists but remains unreadable or unwritable after applying the runner udev rule."
            ls -l /dev/kvm
            exit 1
          fi
          echo "KVM read/write access verified for the ephemeral CI runner."
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug
      - name: Run offline-world emulator journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          script: gradle -p android :app:connectedDebugAndroidTest
      - name: Preserve debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngl-common-ground-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
