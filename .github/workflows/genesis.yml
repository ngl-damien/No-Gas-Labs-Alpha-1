name: Genesis Evidence Invariant
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute genesis invariant
        run: node genesis.test.mjs
      - name: Execute forged-origin regression
        run: node reconstitution/known-weakness-origin-label.test.mjs
