name: Genesis Evidence Invariant
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute content-addressed genesis invariant
        run: node genesis.test.mjs
      - name: Attack evidence boundary
        run: node reconstitution/known-weakness-origin-label.test.mjs
