name: combat-yard-mobile-acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/combat-yard-mobile.yml'
      - 'scripts/verify-combat-yard-mobile.py'
      - 'scripts/verify-quest-board.py'
      - 'game/client.mjs'
      - 'game/combat.mjs'
      - 'game/chronicle.mjs'
      - 'game/institution-view.mjs'
      - 'game/server.mjs'
      - 'game/world-view.mjs'
      - 'game/pixel-world-view.mjs'
      - 'game/sw.js'
      - 'docs/gameplay/COMBAT_YARD_RULES_V1.md'
      - 'test/game-package.test.mjs'
      - 'test/chronicle.test.mjs'
      - 'test/institution-view.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-yard-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run the complete repository portable preflight
        run: npm run agent:preflight:ci
      - name: Include the focused Combat Yard acceptance and dependencies in portable preflight
        run: |
          node scripts/run-agent-preflight-ci.mjs \
            --path game/client.mjs \
            --path game/combat.mjs \
            --path game/chronicle.mjs \
            --path game/institution-view.mjs \
            --path game/server.mjs \
            --path game/world-view.mjs \
            --path game/pixel-world-view.mjs \
            --path game/sw.js \
            --path test/game-package.test.mjs \
            --path docs/gameplay/COMBAT_YARD_RULES_V1.md \
            --path scripts/verify-quest-board.py \
            --path scripts/verify-combat-yard-mobile.py \
            --path .github/workflows/combat-yard-mobile.yml \
            --path test/chronicle.test.mjs \
            --path test/institution-view.test.mjs \
            --checkpoint docs/operations/LATEST_CHECKPOINT.md
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build the standalone game
        run: npm run build:game
      - name: Exercise server-gated Combat Yard and Evidence Archive Chronicle at 320px and 390px
        run: python3 scripts/verify-combat-yard-mobile.py --out artifacts/combat-yard-mobile
      - name: Preserve Combat Yard screenshots, state receipts and preflight
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ngl-combat-yard-mobile-acceptance
          path: |
            artifacts/combat-yard-mobile/
            .runtime/agent-preflight-ci-*.json
          if-no-files-found: warn
          retention-days: 14
