name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  world-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute evidence-bound world projection tests
        run: npm test
