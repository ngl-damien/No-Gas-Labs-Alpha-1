name: verify

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  world-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preflight Forge implementation, regression test, and workflow
        run: npm run agent:preflight -- --path src/forge/runner.mjs --path test/forge-runner.test.mjs --path .github/workflows/verify.yml --checkpoint docs/operations/NGL_AGENT_BOOTSTRAP_CHECKPOINT_2026-10-30.md --receipt .runtime/agent-preflight-forge.json
      - name: Execute tests, package and bounded institutional exercise
        run: npm run verify
