name: verify

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  world-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute tests, package and bounded institutional exercise
        run: npm run verify
      - name: Preserve portable preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/agent-preflight-ci-*.json
          if-no-files-found: warn
          retention-days: 14
