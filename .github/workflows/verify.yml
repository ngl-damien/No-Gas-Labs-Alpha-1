name: verify

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  world-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Execute tests, package and bounded institutional exercise
        run: npm run verify
      - name: Preserve portable preflight receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/agent-preflight-ci-*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Preserve verification reports and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/verification-*/*.json
            .runtime/verification-*/*.stdout.log
            .runtime/verification-*/*.stderr.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
