name: publish-phone-pwa

on:
  pull_request:
    paths:
      - '.github/workflows/publish-phone-pwa.yml'
      - 'game/**'
      - 'test/game-package.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-phone-pwa.yml'
      - 'game/**'
      - 'test/game-package.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-pwa-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the phone-installable static world
        run: |
          mkdir -p _site/assets
          cp game/index.html game/styles.css game/manifest.webmanifest game/sw.js _site/
          cp game/*.mjs _site/
          cp game/assets/app-icon.svg _site/assets/
          if [ -d game/assets/comic ]; then cp -R game/assets/comic _site/assets/comic; fi
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/client.mjs
          test -s _site/sw.js
          test -s _site/manifest.webmanifest
      - name: Preserve the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the phone-installable world
        id: deployment
        uses: actions/deploy-pages@v4
