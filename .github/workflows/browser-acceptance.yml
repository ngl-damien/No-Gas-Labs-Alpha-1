name: browser-acceptance

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playable-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          echo "NGL_CHROMIUM_EXECUTABLE=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Build the standalone game
        run: npm run build:game
      - name: Exercise desktop, mobile, shared-world and recovery journeys
        run: python3 scripts/verify-browser.py --out artifacts/browser-acceptance --standalone
      - name: Preserve browser receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ngl-browser-acceptance
          path: artifacts/browser-acceptance/
          if-no-files-found: warn
          retention-days: 14
