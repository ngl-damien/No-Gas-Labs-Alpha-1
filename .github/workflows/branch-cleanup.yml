name: One-time redundant branch cleanup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Leave blank for a read-only preview. Type DELETE-ONLY-MANIFESTED-BRANCHES to authorize deletion."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out recovery manifest
        uses: actions/checkout@v4
      - name: Preview eligible refs without deleting anything
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseline = 'facee282ae0c0a56031e7bf00a038eac3ebe4926';
            const manifest = fs.readFileSync('recovery/BRANCH-CLEANUP-2026-10-17.md', 'utf8');
            const candidates = [...manifest.matchAll(/^- `([^`]+)`$/gm)].map(m => m[1]);
            if (candidates.length !== 80) throw new Error('Unexpected manifest size: ' + candidates.length);
            const [branches, pulls, repository] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }),
              github.rest.repos.get({ owner, repo })
            ]);
            const openHeads = new Set(pulls
              .filter(p => p.head.repo?.full_name === owner + '/' + repo)
              .map(p => p.head.ref));
            const byName = new Map(branches.map(branch => [branch.name, branch]));
            const eligible = [], skipped = [];
            for (const name of candidates) {
              const branch = byName.get(name);
              if (!branch || branch.protected || branch.commit.sha !== baseline ||
                  openHeads.has(name) || name === repository.data.default_branch) {
                skipped.push(name);
              } else {
                eligible.push(name);
              }
            }
            core.info(JSON.stringify({ mode: 'preview-only', baseline, candidates: candidates.length, eligible, skipped }, null, 2));
            await core.summary.addHeading('NGL branch cleanup preview')
              .addRaw('No branches were deleted. Candidates: ' + candidates.length +
                ', eligible at inspection: ' + eligible.length + ', skipped: ' + skipped.length)
              .addHeading('Would be eligible if separately confirmed')
              .addCodeBlock(eligible.join('\n') || '(none)')
              .addHeading('Skipped')
              .addCodeBlock(skipped.join('\n') || '(none)').write();

  delete:
    if: ${{ success() && inputs.confirmation == 'DELETE-ONLY-MANIFESTED-BRANCHES' }}
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out recovery manifest
        uses: actions/checkout@v4
      - name: Recheck and delete only explicitly authorized exact-baseline refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const confirmation = 'DELETE-ONLY-MANIFESTED-BRANCHES';
            if (context.eventName !== 'workflow_dispatch' ||
                context.payload.inputs?.confirmation !== confirmation) {
              throw new Error('Explicit workflow_dispatch confirmation is required');
            }
            const baseline = 'facee282ae0c0a56031e7bf00a038eac3ebe4926';
            const manifest = fs.readFileSync('recovery/BRANCH-CLEANUP-2026-10-17.md', 'utf8');
            const candidates = [...manifest.matchAll(/^- `([^`]+)`$/gm)].map(m => m[1]);
            if (candidates.length !== 80) throw new Error('Unexpected manifest size: ' + candidates.length);
            const [branches, pulls, repository] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }),
              github.rest.repos.get({ owner, repo })
            ]);
            const openHeads = new Set(pulls
              .filter(p => p.head.repo?.full_name === owner + '/' + repo)
              .map(p => p.head.ref));
            const byName = new Map(branches.map(branch => [branch.name, branch]));
            const deleted = [], skipped = [], errors = [];
            for (const name of candidates) {
              const branch = byName.get(name);
              if (!branch || branch.protected || branch.commit.sha !== baseline ||
                  openHeads.has(name) || name === repository.data.default_branch) {
                skipped.push(name);
                continue;
              }
              try {
                // Re-read the exact ref immediately before deletion to avoid deleting work added since inventory.
                const live = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + name });
                if (live.data.object.sha !== baseline) { skipped.push(name); continue; }
                await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + name });
                deleted.push(name);
              } catch (error) {
                if (error.status === 404) skipped.push(name);
                else errors.push(name + ': ' + error.message);
              }
            }
            core.info(JSON.stringify({ baseline, candidates: candidates.length, deleted, skipped, errors }, null, 2));
            await core.summary.addHeading('NGL branch cleanup results')
              .addRaw('Candidates: ' + candidates.length + ', deleted: ' + deleted.length + ', skipped: ' + skipped.length + ', errors: ' + errors.length)
              .addHeading('Deleted')
              .addCodeBlock(deleted.join('\n') || '(none)')
              .addHeading('Skipped')
              .addCodeBlock(skipped.join('\n') || '(none)')
              .addHeading('Errors')
              .addCodeBlock(errors.join('\n') || '(none)').write();
            if (errors.length) core.setFailed('Some branch deletions failed; see recorded details.');
