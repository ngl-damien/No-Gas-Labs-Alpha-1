name: One-time redundant branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-cleanup.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  clean-redundant-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery manifest
        uses: actions/checkout@v4
      - name: Delete only branches pinned to the recorded identical commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseline = 'facee282ae0c0a56031e7bf00a038eac3ebe4926';
            const manifest = fs.readFileSync('recovery/BRANCH-CLEANUP-2026-10-17.md', 'utf8');
            const candidates = [...manifest.matchAll(/^- `([^`]+)`$/gm)].map(m => m[1]);
            if (candidates.length !== 80) throw new Error('Unexpected manifest size: ' + candidates.length);
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const openHeads = new Set(pulls.filter(p => p.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo).map(p => p.head.ref));
            const byName = new Map(branches.map(b => [b.name, b]));
            const deleted = [], skipped = [], errors = [];
            for (const name of candidates) {
              const branch = byName.get(name);
              if (!branch || branch.protected || branch.commit.sha !== baseline || openHeads.has(name) || name === context.payload.repository.default_branch) {
                skipped.push(name);
                continue;
              }
              try {
                // Re-read the exact ref immediately before deletion to avoid deleting work added since inventory.
                const live = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + name });
                if (live.data.object.sha !== baseline) { skipped.push(name); continue; }
                await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + name });
                deleted.push(name);
              } catch (error) {
                errors.push(name + ': ' + error.message);
              }
            }
            core.info(JSON.stringify({ baseline, candidates: candidates.length, deleted, skipped, errors }, null, 2));
            await core.summary.addHeading('NGL branch cleanup results')
              .addRaw('Candidates: ' + candidates.length + ', deleted: ' + deleted.length + ', skipped: ' + skipped.length + ', errors: ' + errors.length)
              .addHeading('Deleted')
              .addCodeBlock(deleted.join('\n') || '(none)')
              .addHeading('Skipped')
              .addCodeBlock(skipped.join('\n') || '(none)')
              .addHeading('Errors')
              .addCodeBlock(errors.join('\n') || '(none)').write();
            if (errors.length) core.setFailed('Some branch deletions failed; see recorded details.');
