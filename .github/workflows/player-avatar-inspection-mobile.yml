name: player-avatar-inspection-mobile-acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/player-avatar-inspection-mobile.yml'
      - 'scripts/verify-player-avatar-inspection.py'
      - 'scripts/verify-contradiction-clerk-quest.py'
      - 'scripts/verify-quest-board.py'
      - 'game/client.mjs'
      - 'game/pixel-world-view.mjs'
      - 'game/world-view.mjs'
      - 'game/server.mjs'
      - 'game/character-sheet.mjs'
      - 'game/social.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  player-avatar-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run the complete repository portable preflight
        run: npm run agent:preflight:ci
      - name: Include the focused avatar acceptance in portable preflight
        run: |
          node scripts/run-agent-preflight-ci.mjs \
            --path scripts/verify-player-avatar-inspection.py \
            --path .github/workflows/player-avatar-inspection-mobile.yml \
            --path scripts/verify-contradiction-clerk-quest.py \
            --path scripts/verify-quest-board.py \
            --checkpoint docs/operations/LATEST_CHECKPOINT.md
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build the standalone game
        run: npm run build:game
      - name: Exercise two-session mobile avatar inspection and shared publication
        run: python3 scripts/verify-player-avatar-inspection.py --out artifacts/player-avatar-inspection
      - name: Preserve player-profile screenshots, event receipts and preflight
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ngl-player-avatar-inspection-mobile
          path: |
            artifacts/player-avatar-inspection/
            .runtime/agent-preflight-ci-*.json
          if-no-files-found: warn
          retention-days: 14
