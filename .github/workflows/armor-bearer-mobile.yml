name: armor-bearer-mobile-acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/armor-bearer-mobile.yml'
      - 'scripts/verify-armor-bearer-mobile.py'
      - 'scripts/verify-quest-board.py'
      - 'game/client.mjs'
      - 'game/character-sheet.mjs'
      - 'game/quests.mjs'
      - 'game/field-items.mjs'
      - 'game/model.mjs'
      - 'game/server.mjs'
      - 'game/world-view.mjs'
      - 'game/pixel-world-view.mjs'
      - 'game/institution-view.mjs'
      - 'game/styles.css'
      - 'test/game-character-sheet.test.mjs'
      - 'test/game-quests.test.mjs'
      - 'test/game-field-items.test.mjs'
      - 'test/game-model.test.mjs'
      - 'test/game-server.test.mjs'
      - 'test/game-geometry.test.mjs'
      - 'test/pixel-world-view.test.mjs'
      - 'test/institution-view.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-to-armor-bearer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run the complete repository portable preflight
        run: npm run agent:preflight:ci
      - name: Include the focused Forge-to-Armor-Bearer acceptance and dependencies in portable preflight
        run: |
          node scripts/run-agent-preflight-ci.mjs \
            --path game/client.mjs \
            --path game/character-sheet.mjs \
            --path game/quests.mjs \
            --path game/field-items.mjs \
            --path game/model.mjs \
            --path game/server.mjs \
            --path game/world-view.mjs \
            --path game/pixel-world-view.mjs \
            --path game/institution-view.mjs \
            --path game/styles.css \
            --path scripts/verify-quest-board.py \
            --path scripts/verify-armor-bearer-mobile.py \
            --path .github/workflows/armor-bearer-mobile.yml \
            --path test/game-character-sheet.test.mjs \
            --path test/game-quests.test.mjs \
            --path test/game-field-items.test.mjs \
            --path test/game-model.test.mjs \
            --path test/game-server.test.mjs \
            --path test/game-geometry.test.mjs \
            --path test/pixel-world-view.test.mjs \
            --path test/institution-view.test.mjs \
            --checkpoint docs/operations/LATEST_CHECKPOINT.md
      - name: Compile the mobile acceptance harness
        run: python -m py_compile scripts/verify-armor-bearer-mobile.py
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build the standalone game
        run: npm run build:game
      - name: Exercise the actual Forge, recipient gate and accepted transfer at 320px and 390px
        run: python3 scripts/verify-armor-bearer-mobile.py --out artifacts/armor-bearer-mobile
      - name: Preserve Forge, incoming-offer and Quest Board screenshots, state receipts and preflight
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ngl-armor-bearer-mobile-acceptance
          path: |
            artifacts/armor-bearer-mobile/
            .runtime/agent-preflight-ci-*.json
          if-no-files-found: warn
          retention-days: 14
