name: Windows Founder key ACL verification

on:
  pull_request:
    paths:
      - 'src/bounded-file-reader.mjs'
      - 'src/windows-acl.mjs'
      - 'scripts/approve-install.mjs'
      - 'experiment-001/FOUNDER-APPROVAL.md'
      - 'test/approve-install-file-reader.test.mjs'
      - 'test/windows-acl.test.mjs'
      - '.github/workflows/windows-founder-key-ownership.yml'

permissions:
  contents: read

jobs:
  windows-founder-acl:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run portable governance preflight
        run: npm.cmd run agent:preflight:ci
      - name: Verify Windows ACL-backed Founder signing
        run: node --test test/approve-install-file-reader.test.mjs test/windows-acl.test.mjs
